name: Update California mortgage rates

on:
  schedule:
    # 16:00 UTC daily. Morning in California. A failed fetch keeps the last file.
    - cron: "0 16 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch California mortgage rates
        run: python scripts/update-ca-rates.py
      - name: Commit updated rates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ca-rates.json
          if git diff --cached --quiet; then
            echo "Rates unchanged."
          else
            git commit -m "Update California average mortgage rates."
            git push
          fi
